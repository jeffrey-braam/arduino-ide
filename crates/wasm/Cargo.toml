[package]
name = "aide-wasm"
description = "aide-core for the page: the app and the compiler worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aide-core = { path = "../core" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Must match the wasm-bindgen CLI that `cargo aide wasm` runs.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
