<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Guarantees the page never contacts the network: no fetches, no external scripts or styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Arduino IDE</title>
<style>/*INLINE_CSS*/</style>
</head>
<body>
<noscript><p class="banner error">JavaScript is turned off, so the IDE can't run.</p></noscript>
<div id="app">
  <header class="toolbar">
    <button id="btn-verify" class="round" title="Verify (Ctrl+R)" aria-label="Verify">&#10003;</button>
    <button id="btn-upload" class="round" title="Upload (Ctrl+U)" aria-label="Upload">&#10132;</button>
    <span class="sep"></span>
    <button id="btn-new" title="New sketch">New</button>
    <button id="btn-open" title="Open (Ctrl+O)">Open</button>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-saveas" title="Save As (Ctrl+Shift+S)">Save As</button>
    <span class="sep"></span>
    <button id="btn-examples" title="Open an example sketch">Examples</button>
    <button id="btn-libraries" title="See the libraries you can use, and add them to your sketch">Libraries</button>
    <span class="spacer"></span>
    <label class="field">Board
      <select id="board-select"></select>
    </label>
    <button id="btn-port" title="Choose which USB port the board is on">Select port</button>
    <button id="btn-upload-hex" title="Upload an already-compiled .hex file">Upload .hex</button>
    <button id="btn-about" title="About this IDE, licenses and source code">About</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="filebar">
    <div id="file-tabs" class="file-tabs" role="tablist" aria-label="Sketch files"></div>
    <button id="btn-add-tab" class="add-tab" title="Add a file (tab) to the sketch" aria-label="Add tab">+</button>
  </div>
  <main id="editor"></main>
  <div id="splitter" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
  <section id="bottom">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="output" aria-selected="true">Output</button>
      <button role="tab" data-tab="monitor" aria-selected="false">Serial Monitor</button>
      <button role="tab" data-tab="plotter" aria-selected="false" title="Graph the numbers your sketch prints (Ctrl+Shift+L)">Serial Plotter</button>
    </nav>
    <div id="panel-output" class="panel" role="tabpanel">
      <pre id="output" class="console"></pre>
    </div>
    <div id="panel-monitor" class="panel" role="tabpanel" hidden>
      <div class="monitor-bar">
        <button id="mon-connect">Connect</button>
        <select id="mon-baud" title="Baud rate"></select>
        <select id="mon-ending" title="Line ending added when sending">
          <option value="none">No line ending</option>
          <option value="nl">Newline</option>
          <option value="cr">Carriage return</option>
          <option value="both">Both NL &amp; CR</option>
        </select>
        <label class="text-only"><input type="checkbox" id="mon-autoscroll" checked> Autoscroll</label>
        <label class="text-only"><input type="checkbox" id="mon-timestamps"> Timestamps</label>
        <button id="plot-pause" class="plot-only" aria-pressed="false">Pause</button>
        <label class="plot-only">Show
          <select id="plot-points" title="How many recent samples to show">
            <option value="100">100</option>
            <option value="250">250</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
          </select> samples</label>
        <span class="spacer"></span>
        <button id="mon-clear">Clear</button>
      </div>
      <pre id="mon-out" class="console text-only"></pre>
      <div id="plot-area" class="plot-area plot-only">
        <div id="plot-legend" class="plot-legend" aria-live="off"></div>
        <canvas id="plot-canvas" aria-label="Graph of values received from the board"></canvas>
      </div>
      <form id="mon-form" class="monitor-send">
        <input id="mon-input" placeholder="Message to send (Enter)" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </section>
  <footer class="statusbar">
    <span id="status-text">Ready</span>
    <progress id="progress" max="1" value="0" hidden></progress>
    <span class="spacer"></span>
    <span id="status-board"></span>
    <span id="status-port"></span>
    <span id="status-version"></span>
  </footer>
</div>
<dialog id="browser" aria-label="Examples, libraries and about">
  <div class="browser">
    <header class="browser-head">
      <nav class="browser-tabs" role="tablist">
        <button type="button" role="tab" data-view="examples" aria-selected="true">Examples</button>
        <button type="button" role="tab" data-view="libraries" aria-selected="false">Libraries</button>
        <button type="button" role="tab" data-view="about" aria-selected="false">About</button>
      </nav>
      <input id="browser-search" type="search" placeholder="Search examples" aria-label="Search" autocomplete="off">
      <button type="button" id="browser-close" class="icon-button" aria-label="Close">&#x2715;</button>
    </header>
    <div id="browser-examples" class="browser-body">
      <div id="example-list" class="example-list"></div>
      <section class="example-preview" aria-live="polite">
        <div class="preview-head">
          <div>
            <h2 id="example-title"></h2>
            <p id="example-where" class="muted"></p>
          </div>
          <button type="button" id="example-open" class="primary">Open</button>
        </div>
        <div id="example-files" class="example-files" hidden></div>
        <pre id="example-code" class="example-code"></pre>
      </section>
    </div>
    <div id="browser-libraries" class="browser-body library-list" hidden>
      <div id="library-list" class="library-grid"></div>
    </div>
    <div id="browser-about" class="browser-body about" hidden></div>
  </div>
</dialog>
<!--COMPILER_PACK-->
<!--EXAMPLES_PACK-->
<!--ABOUT_PACK-->
<script>/*INLINE_JS*/</script>
</body>
</html>
