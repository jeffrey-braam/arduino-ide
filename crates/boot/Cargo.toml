[package]
name = "aide-boot"
description = "The page's boot decoder: unpacks the compressed app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aide-core = { path = "../core" }
# Must match the wasm-bindgen CLI that `cargo aide wasm` runs.
wasm-bindgen = "=0.2.129"
