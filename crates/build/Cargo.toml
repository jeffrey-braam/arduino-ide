[package]
name = "aide-build"
description = "Builds the single-file IDE and the data it embeds"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aide"
path = "src/main.rs"

[dependencies]
aide-core = { path = "../core" }
miniz_oxide = "0.8"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
